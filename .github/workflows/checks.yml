name: Check Flèche
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install -r requirements-video.lock
      - run: pip install -e '.[dev,video]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - name: Check browser module syntax
        run: |
          for file in src/fencecoach/web/*.js; do
            node --input-type=module --check < "$file"
          done
      - run: python -m unittest discover -s tests -v
      - name: Check pending coach messages
        run: node --experimental-vm-modules scripts/check_coach_loading.mjs
      - run: python -m fencecoach.evaluation
      - name: Exercise MCP tool protocol
        run: python scripts/mcp_smoke.py
      - name: Exercise desktop and mobile product flow
        run: python scripts/browser_smoke.py
      - run: docker build -t fencecoach:ci .
      - name: Exercise the container
        run: |
          docker run -d --name fencecoach-ci -p 127.0.0.1:8001:8000 fencecoach:ci
          trap 'docker logs fencecoach-ci; docker rm -f fencecoach-ci' EXIT
          python scripts/container_smoke.py
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fencecoach-checks
          path: data/evals
