services:
  fencecoach:
    build:
      context: .
      args:
        VIDEO: "true"
    image: fencecoach:oci
    expose:
      - "8000"
    environment:
      COACH_CORE: new
      FENCECOACH_DATABASE_URL: ""
      FENCECOACH_DB_PATH: /app/data/fencecoach.sqlite3
      FENCECOACH_VIDEO_DIR: /app/data/videos
      FENCECOACH_POSE_MODEL: /app/models/pose_landmarker_full.task
      FENCECOACH_VIDEO_WORKER: "true"
      FENCECOACH_COACHING_WORKER: "true"
      FENCECOACH_AUTOMATIC_TRAINING: "false"
      FENCECOACH_SEED_EXAMPLES: "true"
      FENCECOACH_EXAMPLES_DIR: /app/examples/video
      FENCECOACH_CHAT_PROVIDER: groq
      FENCECOACH_LOCAL_FALLBACK: "false"
      FENCECOACH_VERIFIED_DIALOGUE: "true"
      FENCECOACH_PROVIDER_COOLDOWN_SECONDS: "60"
      FENCECOACH_LOCAL_TIMEOUT_SECONDS: "20"
      FENCECOACH_FAST_REPLY_TOKENS: "112"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_CHAT_MODEL: ${GROQ_CHAT_MODEL:-qwen/qwen3.8-27b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.8-flash}
      FENCECOACH_PHOENIX_ENDPOINT: ""
    volumes:
      - fencecoach-data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      FENCECOACH_DOMAIN: ${FENCECOACH_DOMAIN:?Set FENCECOACH_DOMAIN in .env.oci}
      FENCECOACH_BASIC_AUTH_USER: ${FENCECOACH_BASIC_AUTH_USER:?Set FENCECOACH_BASIC_AUTH_USER in .env.oci}
      FENCECOACH_BASIC_AUTH_HASH: ${FENCECOACH_BASIC_AUTH_HASH:?Set FENCECOACH_BASIC_AUTH_HASH in .env.oci}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.oci:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - fencecoach
    restart: unless-stopped

volumes:
  fencecoach-data:
  caddy-data:
  caddy-config:
