# Local demo: no credentials required. First launch downloads the local LLM.
services:
  ollama:
    image: ollama/ollama:0.35.1
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  model-init:
    image: ollama/ollama:0.35.1
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: [ollama, pull, "qwen2.5:1.5b"]
    depends_on:
      ollama:
        condition: service_healthy
  phoenix:
    image: arizephoenix/phoenix:version-15.0.0
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data
    restart: unless-stopped
  fencecoach:
    build:
      context: .
      args:
        VIDEO: "true"
    image: fencecoach:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FENCECOACH_DATABASE_URL: ""
      FENCECOACH_DB_PATH: /app/data/fencecoach.sqlite3
      FENCECOACH_VIDEO_DIR: /app/data/videos
      FENCECOACH_POSE_MODEL: /app/models/pose_landmarker_full.task
      FENCECOACH_VIDEO_WORKER: "true"
      FENCECOACH_COACHING_WORKER: "true"
      FENCECOACH_AUTOMATIC_TRAINING: "false"
      FENCECOACH_SEED_EXAMPLES: "true"
      FENCECOACH_EXAMPLES_DIR: /app/examples/video
      FENCECOACH_CHAT_PROVIDER: local
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: qwen2.5:1.5b
      FENCECOACH_PHOENIX_ENDPOINT: http://phoenix:6006/v1/traces
    volumes:
      - fencecoach-data:/app/data
    depends_on:
      model-init:
        condition: service_completed_successfully
      phoenix:
        condition: service_started
    restart: unless-stopped
volumes:
  fencecoach-data:
  ollama-models:
  phoenix-data:
